// Run after the server build to expose the API dependencies to standalone javac.
allprojects {
    afterEvaluate {
        if (name == 'purpur-server') {
            def validationClasspath = configurations.runtimeClasspath.asPath
            def destination = rootProject.file('validation/classpath.txt')
            tasks.register('writeValidationClasspath') {
                doLast {
                    destination.parentFile.mkdirs()
                    destination.text = validationClasspath
                }
            }
        }
    }
}
