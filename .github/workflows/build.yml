name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Startup Smoke
        run: |
          set -euo pipefail
          smoke_log="$(mktemp)"
          status=0
          timeout 180s ./gradlew :purpur-server:runDevServer >"$smoke_log" 2>&1 || status=$?
          if ! grep -q "Done (" "$smoke_log"; then
            cat "$smoke_log"
            exit 1
          fi
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            cat "$smoke_log"
            exit "$status"
          fi
      - name: Rebuild on Failure
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache --refresh-dependencies
          ./gradlew applyAllPatches --stacktrace 
          ./gradlew build --stacktrace
